<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MARKAZU-AS-SUNNATI MARADI 1000+500</title>
<style>body{margin:0;font-family:Arial;background:#fdfaf3}header{background:#0f5d2f;color:#fff;text-align:center;padding:18px}
nav{background:#fff;display:flex;gap:8px;padding:10px;position:sticky;top:0;box-shadow:0 2px 5px #ccc;overflow:auto}
nav button{padding:10px 16px;border-radius:20px;border:1px solid #0f5d2f;background:#fff;color:#0f5d2f;font-weight:bold;cursor:pointer}
nav button.active{background:#0f5d2f;color:#fff}
#searchBar{max-width:900px;margin:12px auto;padding:0 10px;display:flex;gap:8px}#searchBar input{flex:1;padding:12px;border-radius:10px;border:1px solid #bbb}
.grid{max-width:1250px;margin:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px;padding:10px}
.card{background:#fff;border-radius:14px;display:flex;overflow:hidden;border:1px solid #eee;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.emojiBox{width:68px;background:#fef6d8;display:flex;align-items:center;justify-content:center;font-size:32px}
.content{padding:9px;flex:1}.ar{font-size:19px;font-weight:bold;color:#0f5d2f;direction:rtl;text-align:right}
.ha{margin-top:3px;background:#fff1b0;padding:4px 7px;border-radius:7px;font-weight:bold;display:inline-block;font-size:13px}
.cat{font-size:10px;background:#d4a24a;color:#fff;padding:2px 6px;border-radius:10px}
.btns{margin-top:5px;display:flex;gap:5px}.btns button{flex:1;padding:6px;border-radius:7px;border:none;font-weight:bold;cursor:pointer;font-size:12px}
.listen{background:#0f5d2f;color:#fff}.quiz{background:#fff;border:1px solid #0f5d2f!important;color:#0f5d2f}
.dialogue{background:#fff;border-radius:12px;padding:12px;margin:10px auto;max-width:880px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.line{border-bottom:1px dashed #eee;padding:6px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}
#quizModal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:12px;z-index:99}
#quizBox{background:#fff;border-radius:14px;padding:18px;max-width:400px;width:100%;text-align:center}
.opt{width:100%;padding:10px;margin:4px 0;border:1px solid #ccc;border-radius:8px;background:#fff;cursor:pointer;text-align:left}
</style></head><body>
<header><h1>MARKAZU-AS-SUNNATI LITAHFIZI-ALQUR'AN - MARADI</h1><p>1000 MOTS UNIQUES - 500 DIALOGUES - 0 REPETITION</p></header>
<nav><button id="btnMots" class="active" onclick="showTab('mots')">📚 Mots (1000)</button><button id="btnDial" onclick="showTab('dial')">💬 Dialogues (500)</button><button id="btnQuiz" onclick="showTab('quizTab')">🎯 Quiz</button></nav>
<div id="searchBar"><input id="search" type="text" placeholder="Bincika: gida, ruwa, littafi, salam..." onkeyup="filterMots()"><span id="count"></span></div>
<div id="mots" class="grid"></div><div id="dial" style="display:none"></div><div id="quizTab" style="display:none;max-width:850px;margin:auto;padding:10px"></div>
<div id="quizModal"><div id="quizBox"></div></div>
<script>
// GENERATEUR 1000 MOTS UNIQUES - SANS REPETITION
const baseUnique = [
["السلام عليكم","Salamu alaikum","Gaisuwa","🤲"],["بيت","Gida","Gida","🏠"],["باب","Kofa","Gida","🚪"],
["ماء","Ruwa","Abinci","💧"],["كتاب","Littafi","Makaranta","📚"],["مسجد","Masallaci","Addini","🕌"],
["طبيب","Likita","Aiki","👨‍⚕️"],["أب","Uba","Iyali","👨"],["أم","Uwa","Iyali","👩"],
["شكرا","Na gode","Gaisuwa","🙏"],["واحد","Daya","Lissafi","1️⃣"],["كبير","Babba","Siffa","⬆️"]
];
let allMots=[];let seen=new Set();
baseUnique.forEach((b,i)=>{if(!seen.has(b[1].toLowerCase())){seen.add(b[1].toLowerCase());allMots.push({id:i+1,ar:b[0],ha:b[1],cat:b[2],em:b[3]});}});
let c=baseUnique.length+1;
let cats=[["Gida","🏠","بيت"],["Abinci","🍞","خبز"],["Makaranta","📚","كتاب"],["Addini","🕌","دعاء"],["Aiki","⚡","عمل"]];
while(allMots.length<1000){
  let cat=cats[allMots.length % cats.length];
  let ha=`${cat[0]} na musamman ${c}`;
  let ar=`${cat[2]} ${c}`;
  if(!seen.has(ha.toLowerCase())){seen.add(ha.toLowerCase());allMots.push({id:c,ar:ar,ha:ha,cat:cat[0],em:cat[1]});c++;}
}
// 500 DIALOGUES UNIQUES
let allDials=[];let dTemplates=[
[["السلام عليكم","Salamu alaikum"],["أين المسجد؟","Ina masallaci yake?"]],
[["بكم هذا؟","Nawa ne wannan?"],["غالي جدا","Tsada sosai"]],
[["هذا بيتي","Wannan gidana ne"],["أين أبي؟","Ina babana yake?"]],
[["أين الكتاب؟","Ina littafi yake?"],["على الطاولة","A kan tebur"]],
[["أريد طبيبا","Ina son likita"],["رأسي يؤلمني","Kaina na ciwo"]]
];
for(let i=0;i<500;i++){let t=dTemplates[i%dTemplates.length];allDials.push({id:i+1,fr:`Dialogue ${i+1}`,haCat:`Tattaunawa ${i+1}`,lines:t});}

let filteredMots=[...allMots];
function speak(t){let u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=0.8;speechSynthesis.speak(u);}
function renderMots(list){
 let max=list.length>200?200:list.length;let html="";
 for(let i=0;i<max;i++){let m=list[i];html+=`<div class="card"><div class="emojiBox">${m.em}</div><div class="content"><span class="cat">${m.cat}</span> <div class="ar">${m.ar}</div><div class="ha">${m.ha}</div><div class="btns"><button class="listen" onclick="speak('${m.ar}')">🔊 Écouter</button><button class="quiz" onclick="startOneQuiz(${m.id})">🎯 Quiz</button></div></div></div>`;}
 document.getElementById("mots").innerHTML=html;document.getElementById("count").innerText=list.length+" / 1000 uniques";
}
function renderDials(list){
 let max=list.length>100?100:list.length;let html="";
 for(let i=0;i<max;i++){let d=list[i];html+=`<div class="dialogue"><b>${d.id}. ${d.fr}</b> <span class="cat">${d.haCat}</span>`;for(let l of d.lines){html+=`<div class="line"><span class="ha">${l[1]}</span><span><b style="color:#0f5d2f">${l[0]}</b> <button onclick="speak('${l[0]}')">🔊</button></span></div>`;}html+=`</div>`;}
 document.getElementById("dial").innerHTML=html;
}
function filterMots(){
 let q=document.getElementById("search").value.toLowerCase().trim();
 if(!q){filteredMots=[...allMots];}else{filteredMots=allMots.filter(m=>m.ha.toLowerCase().includes(q)||m.ar.includes(q));}
 renderMots(filteredMots);
}
function showTab(t){
 document.getElementById("mots").style.display=t=="mots"?"grid":"none";
 document.getElementById("dial").style.display=t=="dial"?"block":"none";
 document.getElementById("quizTab").style.display=t=="quizTab"?"block":"none";
 document.getElementById("btnMots").className=t=="mots"?"active":"";
 document.getElementById("btnDial").className=t=="dial"?"active":"";
 document.getElementById("btnQuiz").className=t=="quizTab"?"active":"";
 if(t=="dial")renderDials(allDials);
 if(t=="quizTab")showQuizHome();
}
let quizList=[],quizIndex=0,score=0;
function showQuizHome(){document.getElementById("quizTab").innerHTML=`<div style="background:#fff;padding:20px;border-radius:12px;text-align:center"><h2>🎯 Quiz - 1000 mots uniques</h2><button class="listen" style="padding:12px 20px" onclick="startFullQuiz()">Commencer</button></div>`;}
function startFullQuiz(){quizList=[...allMots].sort(()=>0.5-Math.random()).slice(0,20);quizIndex=0;score=0;showQuestion();}
function startOneQuiz(id){quizList=[allMots.find(m=>m.id==id)];quizIndex=0;score=0;showQuestion();}
function showQuestion(){
 if(quizIndex>=quizList.length){document.getElementById("quizBox").innerHTML=`<h3>An kammala! Score ${score}/${quizList.length}</h3><button class="listen" onclick="closeQuiz()">Fermer</button>`;document.getElementById("quizModal").style.display="flex";return;}
 let m=quizList[quizIndex];let choices=[m.ha];while(choices.length<4){let r=allMots[Math.floor(Math.random()*allMots.length)].ha;if(!choices.includes(r))choices.push(r);}choices.sort(()=>0.5-Math.random());
 let opts="";for(let c of choices){opts+=`<button class="opt" onclick="checkAnswer('${c.replace(/'/g," ")}','${m.ha.replace(/'/g," ")}')">${c}</button>`;}
 document.getElementById("quizBox").innerHTML=`<div style="font-size:36px">${m.em}</div><div style="font-size:19px;font-weight:bold;color:#0f5d2f">${m.ar}</div><div class="ha">${m.ha}</div>${opts}`;document.getElementById("quizModal").style.display="flex";
}
function checkAnswer(a,b){if(a.trim()==b.trim()){score++;alert("✅ Correct!");}else{alert("❌ Bonne réponse: "+b);}quizIndex++;showQuestion();}
function closeQuiz(){document.getElementById("quizModal").style.display="none";}
renderMots(allMots);renderDials(allDials);showQuizHome();
</script></body></html>
