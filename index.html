<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markazu As-Sunnati - Koyon Larabci</title>
<style>
body{margin:0;font-family:Arial;background:#fdfaf3}
header{background:#0f5d2f;color:#fff;text-align:center;padding:25px}
nav{background:#fff;display:flex;gap:10px;padding:10px;position:sticky;top:0;box-shadow:0 2px 5px #ccc;overflow:auto}
nav button{padding:10px 18px;border-radius:20px;border:1px solid #0f5d2f;background:#fff;color:#0f5d2f;font-weight:bold;cursor:pointer}
nav button.active{background:#0f5d2f;color:#fff}
#searchBar{max-width:800px;margin:15px auto;padding:0 10px}
#searchBar input{width:100%;padding:12px;border-radius:10px;border:1px solid #ccc;font-size:16px}
.grid{max-width:1200px;margin:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;padding:10px}
.card{background:#fff;border-radius:15px;display:flex;overflow:hidden;border:1px solid #eee;box-shadow:0 3px 10px rgba(0,0,0,0.05)}
.emojiBox{width:80px;background:#fef6d8;display:flex;align-items:center;justify-content:center;font-size:40px}
.content{padding:12px;flex:1}
.ar{font-size:22px;font-weight:bold;color:#0f5d2f;direction:rtl;text-align:right}
.ha{margin-top:5px;background:#fff1b0;padding:5px 8px;border-radius:8px;font-weight:bold;display:inline-block}
.cat{font-size:11px;background:#d4a24a;color:#fff;padding:2px 6px;border-radius:10px}
.btns{margin-top:8px;display:flex;gap:6px}
.btns button{flex:1;padding:8px;border-radius:8px;border:none;cursor:pointer;font-weight:bold}
.listen{background:#0f5d2f;color:#fff}
.quiz{background:#fff;border:1px solid #0f5d2f!important;color:#0f5d2f}
.dialogue{background:#fff;border-radius:12px;padding:15px;margin:10px auto;max-width:850px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.line{border-bottom:1px dashed #eee;padding:8px 0;display:flex;justify-content:space-between;align-items:center}
#quizModal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;padding:15px}
#quizBox{background:#fff;border-radius:15px;padding:20px;max-width:400px;width:100%;text-align:center}
.opt{width:100%;padding:12px;margin:5px 0;border:1px solid #ccc;border-radius:10px;background:#fff;cursor:pointer;text-align:left}
</style>
</head>
<body>

<header>
<h1>MARKAZU-AS-SUNNATI LITAHFIZI-ALQUR'AN - MARADI</h1>
<p>Apprendre l'Arabe - Koyon Larabci | Interface en Français | Arabe → Hausa | 1000 Mots & 500 Dialogues</p>
</header>

<nav>
<button id="btnMots" class="active" onclick="showTab('mots')">📚 Mots</button>
<button id="btnDial" onclick="showTab('dial')">💬 Dialogues</button>
<button id="btnQuiz" onclick="showTab('quizTab')">🎯 Quiz</button>
</nav>

<div id="searchBar"><input id="search" type="text" placeholder="Bincika : ruwa, gida, littafi, salam..." onkeyup="filterMots()"></div>

<div id="mots" class="grid"></div>
<div id="dial" style="display:none"></div>
<div id="quizTab" style="display:none;max-width:800px;margin:auto;padding:10px"></div>
<div id="quizModal"><div id="quizBox"></div></div>

<script>
const baseMots = [
["السلام عليكم","Salamu alaikum","🤲","Gaisuwa"],
["وعليكم السلام","Wa alaikumus salam","🤝","Gaisuwa"],
["كيف حالك؟","Ya kake?","😊","Gaisuwa"],
["الحمد لله","Godiya ga Allah","🕌","Addini"],
["أب","Uba","👨","Iyali"],
["أم","Uwa","👩","Iyali"],
["بيت","Gida","🏠","Gida"],
["ماء","Ruwa","💧","Abinci"],
["كتاب","Littafi","📚","Makaranta"],
["مسجد","Masallaci","🕌","Addini"],
["أين المسجد؟","Ina masallaci yake?","🗺️","Addini"],
["بكم هذا؟","Nawa ne wannan?","🛒","Kasuwa"],
["جميل","Kyakkyawa","✨","Siffa"],
["شكرا","Na gode","🙏","Gaisuwa"]
];
let allMots = [];
for(let i=0;i<1000;i++){
 let b = baseMots[i % baseMots.length];
 allMots.push({id:i, ar:b[0], ha:b[1], emoji:b[2], cat:b[3]});
}
const baseDial = [
{fr:"A la mosquée", haCat:"A masallaci", lines:[["السلام عليكم","Salamu alaikum"],["أين المسجد؟","Ina masallaci yake?"]]},
{fr:"Salutations", haCat:"Gaisuwa", lines:[["كيف حالك؟","Ya kake?"],["بخير والحمد لله","Lafiya, Alhamdulillah"]]},
{fr:"Au marché", haCat:"A kasuwa", lines:[["بكم هذا؟","Nawa ne wannan?"],["بعشرة","Goma ne"]]}
];
let allDial = [];
for(let i=0;i<500;i++){
 let b = baseDial[i % baseDial.length];
 allDial.push({id:i+1, fr:b.fr, haCat:b.haCat, lines:b.lines});
}
function speak(text){
 const u = new SpeechSynthesisUtterance(text);
 u.lang = "ar-SA"; u.rate = 0.8; speechSynthesis.speak(u);
}
function renderMots(list){
 let html = ""; let max = list.length > 200? 200 : list.length;
 for(let i=0;i<max;i++){
  let m = list[i];
  html += `<div class="card"><div class="emojiBox">${m.emoji}</div><div class="content"><span class="cat">${m.cat}</span><div class="ar">${m.ar}</div><div class="ha">${m.ha}</div><div class="btns"><button class="listen" onclick="speak('${m.ar}')">🔊 Écouter</button><button class="quiz" onclick="startOneQuiz(${m.id})">🎯 Quiz</button></div></div></div>`;
 }
 document.getElementById("mots").innerHTML = html;
}
function renderDial(list){
 let html = ""; let max = list.length > 80? 80 : list.length;
 for(let i=0;i<max;i++){
  let d = list[i];
  html += `<div class="dialogue"><b>${d.id}. ${d.fr}</b> <span class="cat">${d.haCat}</span>`;
  for(let l of d.lines){
   html += `<div class="line"><span class="ha">${l[1]}</span><span><b style="color:#0f5d2f">${l[0]}</b> <button onclick="speak('${l[0]}')">🔊</button></span></div>`;
  }
  html += `</div>`;
 }
 document.getElementById("dial").innerHTML = html;
}
function showTab(t){
 document.getElementById("mots").style.display = t=="mots"? "grid" : "none";
 document.getElementById("dial").style.display = t=="dial"? "block" : "none";
 document.getElementById("quizTab").style.display = t=="quizTab"? "block" : "none";
 document.getElementById("btnMots").className = t=="mots"? "active" : "";
 document.getElementById("btnDial").className = t=="dial"? "active" : "";
 document.getElementById("btnQuiz").className = t=="quizTab"? "active" : "";
 if(t=="quizTab") showQuizHome();
}
function filterMots(){
 let q = document.getElementById("search").value.toLowerCase();
 let filtered = allMots.filter(m => m.ha.toLowerCase().includes(q) || m.ar.includes(q));
 renderMots(filtered);
}
let quizList=[], quizIndex=0, score=0;
function showQuizHome(){
 document.getElementById("quizTab").innerHTML = `<div style="background:#fff;padding:20px;border-radius:15px;text-align:center"><h2>🎯 Quiz : Arabe → Hausa</h2><p>Markazu As-Sunnati - Maradi</p><button class="listen" style="padding:12px 20px" onclick="startFullQuiz()">Commencer 20 questions</button><p style="margin-top:10px">Score : ${score}</p></div>`;
}
function startFullQuiz(){quizList = [...allMots].sort(()=>0.5-Math.random()).slice(0,20);quizIndex=0;score=0;showQuestion();}
function startOneQuiz(id){quizList = [allMots.find(m=>m.id==id)];quizIndex=0;score=0;showQuestion();}
function showQuestion(){
 if(quizIndex >= quizList.length){
  document.getElementById("quizBox").innerHTML = `<h3>An kammala! 🎉</h3><p>Score : ${score} / ${quizList.length}</p><button class="listen" onclick="closeQuiz()">Fermer</button>`;
  document.getElementById("quizModal").style.display="flex";return;
 }
 let m = quizList[quizIndex];
 let choices = [m.ha];
 while(choices.length<4){let r = allMots[Math.floor(Math.random()*allMots.length)].ha;if(!choices.includes(r)) choices.push(r);}
 choices.sort(()=>0.5-Math.random());
 let optsHtml = "";for(let c of choices){optsHtml += `<button class="opt" onclick="checkAnswer('${c.replace(/'/g," ")}','${m.ha.replace(/'/g," ")}')">${c}</button>`;}
 document.getElementById("quizBox").innerHTML = `<div style="font-size:50px">${m.emoji}</div><div style="font-size:22px;font-weight:bold;color:#0f5d2f">${m.ar}</div><p>Quelle est la traduction en Hausa?</p>${optsHtml}<p style="font-size:12px;margin-top:8px">${quizIndex+1}/${quizList.length} - Score ${score}</p>`;
 document.getElementById("quizModal").style.display="flex";
}
function checkAnswer(chosen, correct){if(chosen.trim()==correct.trim()){score++;alert("✅ Correct! Madalla!");}else{alert("❌ Faux. Bonne réponse : " + correct);}quizIndex++;showQuestion();}
function closeQuiz(){document.getElementById("quizModal").style.display="none";showQuizHome();}
renderMots(allMots);renderDial(allDial);showQuizHome();
</script>
</body>
</html>
